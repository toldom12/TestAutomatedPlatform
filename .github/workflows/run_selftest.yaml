name: Arduino Nano self-test

on:
  # Allows the self-test to be started manually from GitHub Actions.
  workflow_dispatch:
    inputs:
      test_arguments:
        description: "Test arguments: device, flashing type and test type"
        required: true
        default: "--arduino_nano --flash --selftest"
        type: string

jobs:
  nano-selftest:
    # Dedicated Windows runner physically connected to Arduino Nano.
    runs-on: [self-hosted, windows, arduino-lab]

    steps:
      # Download the repository source code to the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure the Python version used by the tests.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install all Python dependencies required by the project.
      - name: Install test dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Run the Arduino Nano self-test with the selected test arguments.
      #
      # Example:
      #   --arduino_nano --flash --selftest
      #
      # -vv = detailed pytest output
      # -s  = show print() output in the CI log
      - name: Run Arduino Nano self-test
        shell: cmd
        run: |
          python -m pytest CICD\selftest\test_perform_selftest.py::test_run_selftest --test_args="${{ inputs.test_arguments }}" -vv -s